aid: axend
name: Axend
description: Axend is an online investment marketplace that connects individual investors in Latin
  America with private company and project investment opportunities. Operating as an aggregator, it
  partners with allied investment platforms and earns commissions when users register or transact
  through them. The platform provides portfolio-building tools to analyze projects by industry,
  timeline, and expected return, personalized support for managing capital, and dynamic
  reconfiguration so investors can adjust their preferences to optimize financial performance. Axend
  is a portfolio company of 500 Global. It exposes no public API, developer documentation, or SDKs at
  this time.
